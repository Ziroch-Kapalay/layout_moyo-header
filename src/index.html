<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="site__header">
      <div class="container">
        <div class="header__content">
          <a href="#logo">
            <img
              src="./images/logo.png"
              alt="logo-MOYO"
              class="logo__link"
            />
          </a>
          <nav class="navbar">
            <ul class="nav">
              <li class="nav__list">
                <a
                  class="nav__link is-active"
                  href="#apple"
                >
                  apple
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#samsung"
                >
                  samsung
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#smartphones"
                >
                  smartphones
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#laptops"
                  data-qa="hover"
                >
                  laptops & computers
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#gadgets"
                >
                  gadgets
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#tables"
                >
                  tables
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#photo"
                >
                  photo
                </a>
              </li>

              <li class="nav__list">
                <a
                  class="nav__link"
                  href="#video"
                >
                  video
                </a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
  </body>
</html>
